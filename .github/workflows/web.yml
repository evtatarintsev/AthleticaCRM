name: Web Client Checks

# Проверки веб-клиента (web/) на каждом PR: типы, линтер, покрытие типами,
# форматирование и тесты — та же команда, что выполняется при сборке образа frontend.
on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm run check
