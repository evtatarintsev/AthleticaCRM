name: Mobile

# Мобильное приложение (`:mobile`, `:mobile:androidApp`) собирается только с `-Pathletica.mobile=true`:
# остальным job-ам и Docker-сборке Android SDK не нужен. Здесь — debug APK, тесты общих экранов
# (JVM) и ktlint модуля; Android SDK на ubuntu-latest уже установлен.
on:
  pull_request:
    paths:
      - "mobile/**"
      - "shared/**"
      - "gradle/**"
      - "*.gradle.kts"
      - ".github/workflows/mobile.yml"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew -Pathletica.mobile=true :mobile:check :mobile:androidApp:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: athletica-debug-apk
          path: mobile/androidApp/build/outputs/apk/debug/*.apk
