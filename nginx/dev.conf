# Сертификат: nginx/certs/dev.{crt,key}, генерируется nginx/gen-dev-cert.sh.
ssl_certificate     /etc/nginx/certs/dev.crt;
ssl_certificate_key /etc/nginx/certs/dev.key;

# HTTP → HTTPS для всех dev-хостов
server {
    listen 80;
    server_name athletica.crm app.athletica.crm clients.athletica.crm minio.athletica.crm console.minio.athletica.crm;
    return 301 https://$host$request_uri;
}

# athletica.crm → публичный лендинг (web/landing смонтирован в контейнер)
server {
    listen 443 ssl;
    server_name athletica.crm;

    root /usr/share/nginx/landing;

    # Вход и регистрация живут в CRM
    location = /login {
        return 302 https://app.athletica.crm$request_uri;
    }

    location = /sign-up {
        return 302 https://app.athletica.crm$request_uri;
    }

    # Кабинет клиента показывает вход в корне своего хоста
    location = /cabinet {
        return 302 https://clients.athletica.crm/;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

# app.athletica.crm → Vite dev server (frontend) + Ktor (backend API)
server {
    listen 443 ssl;
    server_name app.athletica.crm;

    # Загрузка файлов до 10 МБ: импорт таблиц и фото журнала
    client_max_body_size 11m;

    # Как в prod: CRM закрыта от поисковиков и не встраивается в чужие сайты, кроме виджета
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    # Ktor REST API
    # Ход помощника с вложениями длится до 180 с (распознавание фото и подготовка импорта)
    location /api/assistant/ {
        proxy_pass         http://host.docker.internal:8080;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 190s;
    }

    location /api/ {
        proxy_pass         http://host.docker.internal:8080;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Публичный виджет расписания встраивается в iframe на любом сайте.
    # add_header здесь отменяет заголовки уровня server, поэтому X-Robots-Tag повторён.
    location /widget/ {
        add_header Content-Security-Policy "frame-ancestors *" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_pass         http://host.docker.internal:5173;
        proxy_set_header   Host $host;
    }

    # Веб-фронтенд: Vite dev server (npm run dev в web/), включая HMR
    location / {
        proxy_pass         http://host.docker.internal:5173;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
    }
}

# clients.athletica.crm → Vite dev server кабинета клиента (порт 5174) + Ktor (только /api/client-app/, как в prod)
server {
    listen 443 ssl;
    server_name clients.athletica.crm;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    location /api/client-app/ {
        proxy_pass         http://host.docker.internal:8080;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /api/ {
        return 404;
    }

    location / {
        proxy_pass         http://host.docker.internal:5174;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
    }
}

# minio.athletica.crm → S3 API RustFS (порт 9000)
# Используется браузером для загрузки файлов по presigned URL.
# Чтобы presigned URL-ы содержали этот хост, запускай Ktor с:
#   MINIO_PUBLIC_ENDPOINT=https://minio.athletica.crm
server {
    listen 443 ssl;
    server_name minio.athletica.crm;

    client_max_body_size 100m;

    location / {
        proxy_pass       http://host.docker.internal:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering  off;
    }
}

# console.minio.athletica.crm → веб-консоль RustFS (порт 9001)
server {
    listen 443 ssl;
    server_name console.minio.athletica.crm;

    location / {
        proxy_pass         http://host.docker.internal:9001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
    }
}
