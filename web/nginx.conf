# Статика веб-фронтенда. Внешний nginx проксирует сюда `/` без изменения пути.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;

    # Ассеты Vite содержат хэш в имени — кэшируем навсегда
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Любой другой путь — маршрут SPA; index.html не кэшируется
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
