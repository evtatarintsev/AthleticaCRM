# Окружение разработки: `mise trust && mise install`, дальше `mise run <задача>` (список — `mise tasks`).

[tools]
java = "temurin-25"
node = "24"

[env]
_.path = ["{{config_root}}/bin"]

[tasks.build]
description = "Сборка и проверки сервера, веб-клиента и кабинета клиента"
run = ["./gradlew build", "cd web && npm ci && npm run check", "cd cabinet && npm ci && npm run check"]

[tasks.test]
description = "Тесты сервера"
run = "./gradlew test"

[tasks.format]
description = "Форматирование Kotlin и TypeScript"
run = ["./gradlew ktlintFormat", "cd web && npm run format", "cd cabinet && npm run format", "cd e2e && npm run format"]

[tasks.contracts]
description = "Перегенерировать контракты API веб-клиента"
dir = "web"
run = "npm run contracts"

[tasks.server]
description = "Запустить веб-сервер в режиме разработки Ktor (коды входа в кабинет пишутся в лог)"
run = "athletica serve"
env = { JAVA_OPTS = "-Dio.ktor.development=true" }
quiet = true

[tasks.admin]
description = "Административные команды: mise run admin org find ЦР (для --help: mise run admin -- --help)"
run = "athletica admin"
quiet = true

[tasks.web]
description = "Dev-сервер фронтенда"
dir = "web"
run = "npm run dev"

[tasks.cabinet]
description = "Dev-сервер кабинета клиента"
dir = "cabinet"
run = "npm run dev"

[tasks.all]
description = "Сервер, фронтенд и кабинет клиента разом (параллельно, Ctrl+C останавливает всё)"
depends = ["server", "web", "cabinet"]

[tasks.deploy-android]
description = "Собрать Android-приложение, поставить на телефон по USB и запустить: mise run deploy-android [-- https://сервер/api/]"
run = "mobile/androidApp/deploy.sh"

[tasks.e2e]
description = "E2E-тесты на полном стенде: mise run e2e [-- --keep] [-- аргументы playwright]"
run = "e2e/stand/run.sh"
