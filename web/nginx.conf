# Статика веб-фронтенда. Внешний nginx проксирует сюда `/` хоста CRM (app.) без изменения пути.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;

    # Ассеты Vite содержат хэш в имени — кэшируем навсегда
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Любой другой путь — маршрут SPA; index.html не кэшируется
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}

# Публичный лендинг (web/landing). Внешний nginx проксирует сюда корень основного домена.
server {
    listen 8081;
    server_name _;
    root /usr/share/nginx/landing;
    absolute_redirect off;

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
