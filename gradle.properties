#Kotlin
kotlin.code.style=official
# Compose Multiplatform 1.12 увеличил объём генерируемого кода: на 4096M
# JVM-бэкенд Kotlin падает с OutOfMemoryError при параллельной сборке
# wasm-production и jvm-таргетов composeApp.
kotlin.daemon.jvmargs=-Xmx6144M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
# AGP 9 по умолчанию включает собственный Kotlin-плагин и новый DSL, которые
# несовместимы с org.jetbrains.kotlin.multiplatform. Android-таргет собирается
# через KMP, поэтому остаёмся на старом поведении.
android.builtInKotlin=false
android.newDsl=false
