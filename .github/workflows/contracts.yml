name: Web Contracts

# Контракты API веб-клиента (web/src/api/generated) и кабинета клиента
# (cabinet/src/api/generated) генерируются из маршрутов сервера и схем shared. Job перегенерирует их и падает, если результат отличается от закоммиченного.
on:
  pull_request:
    paths:
      - "server/**"
      - "shared/**"
      - "web/src/api/generated/**"
      - "cabinet/src/api/generated/**"
      - "gradle/**"
      - "*.gradle.kts"
      - ".github/workflows/contracts.yml"

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew :server:generateWebContracts

      - name: Контракты актуальны
        run: |
          for dir in web/src/api/generated cabinet/src/api/generated; do
            if ! git diff --exit-code -- "$dir"; then
              echo "::error::Контракты устарели: выполните 'npm run contracts' и закоммитьте $dir"
              exit 1
            fi
            if [ -n "$(git status --porcelain -- "$dir")" ]; then
              echo "::error::В $dir появились незакоммиченные файлы: выполните 'npm run contracts'"
              exit 1
            fi
          done
