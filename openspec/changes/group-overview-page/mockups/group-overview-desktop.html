<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Группа — обзор</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#f7f7f8; --surface:#fff; --surface-2:#fafafa; --line:#ececef; --line-strong:#dcdce0;
  --text:#111113; --text-2:#3f3f46; --muted:#6b6b74;
  --brand:#2f55d4; --brand-hover:#2443b0; --brand-soft:#eef2ff; --brand-ink:#2443b0;
  --warn-soft:#fff4dc; --warn-ink:#8a4b00; --bad-soft:#ffe9e9; --bad-ink:#a3171b; --good-ink:#15803d;
  --shadow:0 1px 2px rgba(16,16,20,.04),0 4px 16px rgba(16,16,20,.04);
  --pop:0 12px 32px rgba(16,16,20,.12);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e0e11; --surface:#17171b; --surface-2:#1c1c21; --line:#26262c; --line-strong:#34343b;
    --text:#f4f4f6; --text-2:#cfcfd6; --muted:#9a9aa5;
    --brand:#5b7cf0; --brand-hover:#7591f3; --brand-soft:#1d2440; --brand-ink:#a9bbff;
    --warn-soft:#3a2a0c; --warn-ink:#f5c46b; --bad-soft:#3b1515; --bad-ink:#ff9b9b; --good-ink:#6ee7a0;
    --shadow:none; --pop:0 12px 32px rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--brand);text-decoration:none}a:hover{color:var(--brand-hover)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding:28px 16px 80px;display:flex;flex-direction:column;gap:20px}
@media (min-width:720px){.wrap{padding:36px 32px 96px}}

.crumbs{font-size:13px;color:var(--muted);display:flex;gap:6px}
.crumbs a{color:var(--muted)}.crumbs a:hover{color:var(--text)}

.hero{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-start;justify-content:space-between}
.hero h1{margin:0;font-size:30px;line-height:1.15;font-weight:700;letter-spacing:-.02em}
.title-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;font-weight:500;color:var(--text-2)}
.meta{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:12px;font-size:14px;color:var(--text-2);align-items:center}
.meta-item{display:inline-flex;gap:8px;align-items:center}
.meta-item svg{color:var(--muted);flex:none}
.meta b{font-weight:600;color:var(--text)}
.sep{width:1px;height:16px;background:var(--line-strong)}

.actions{display:flex;gap:8px;position:relative}
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500;white-space:nowrap;box-shadow:var(--shadow);transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--line-strong);background:var(--surface-2)}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-hover);border-color:var(--brand-hover)}
.btn-icon{width:40px;padding:0;justify-content:center}
.btn-sm{height:32px;padding:0 12px;font-size:13px;border-radius:8px;box-shadow:none}
.menu{position:absolute;top:48px;right:0;z-index:20;width:244px;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--pop);display:flex;flex-direction:column;animation:pop .14s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
.mi{display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border:0;border-radius:8px;background:transparent;font-size:14px;text-align:left}
.mi:hover{background:var(--surface-2)}
.mi svg{color:var(--muted)}
.mi-danger{color:var(--bad-ink)}.mi-danger svg{color:var(--bad-ink)}
.mi-sep{height:1px;background:var(--line);margin:6px 4px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}

.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;padding:8px}
.day{display:flex;flex-direction:column;gap:2px;padding:10px;border-radius:10px;min-height:76px;color:var(--text);transition:background .15s}
a.day:hover{background:var(--surface-2)}
.day .dn{font-size:12px;font-weight:500;color:var(--muted)}
.day .dt{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.day .dx{font-size:12px;color:var(--muted)}
.day.off .dn{opacity:.6}
.day.today .dn{color:var(--brand)}
.day.next{background:var(--brand-soft)}
.day.next .dx{color:var(--brand-ink);font-weight:500}
.bar{height:4px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
@media (max-width:640px){.week{grid-template-columns:repeat(7,72px);overflow-x:auto}}

.week-foot{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:10px 16px;border-top:1px solid var(--line);font-size:13.5px;color:var(--text-2)}
.note{display:inline-flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:99px;flex:none}

.attn-head{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border:0;background:transparent;text-align:left}
.attn-icon{width:32px;height:32px;border-radius:10px;background:var(--warn-soft);color:var(--warn-ink);display:inline-flex;align-items:center;justify-content:center;flex:none}
.attn-title{font-weight:600}
.attn-sub{font-size:13.5px;color:var(--muted)}
.stack{display:flex;margin-left:auto}
.stack .av{border:2px solid var(--surface);margin-left:-8px}
.chev{color:var(--muted);transition:transform .2s;flex:none}
.attn-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:12px 16px;border-top:1px solid var(--line)}
.attn-row .who{display:inline-flex;align-items:center;gap:10px;font-weight:500;color:var(--text);flex:1 1 200px;min-width:0}
.attn-row .why{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--text-2);flex:2 1 260px;min-width:0}

.coaches{display:flex}.coaches .av{width:26px;height:26px;font-size:10.5px;box-shadow:0 0 0 2px var(--bg)}.coaches .av+.av{margin-left:-6px}
.av{width:30px;height:30px;border-radius:99px;display:inline-flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:600;flex:none}

.badge{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.b-warn{background:var(--warn-soft);color:var(--warn-ink)}
.b-bad{background:var(--bad-soft);color:var(--bad-ink)}

.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;padding:4px;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.seg button{height:34px;padding:0 14px;border:0;border-radius:8px;background:transparent;font-size:14px;font-weight:500;color:var(--muted);transition:background .15s,color .15s}
.seg button:hover{color:var(--text)}
.seg button[aria-selected="true"]{background:var(--text);color:var(--surface)}
.seg .cnt{opacity:.6;margin-left:4px;font-variant-numeric:tabular-nums}

.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;width:220px;max-width:100%}
.search:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.search input{border:0;outline:0;background:transparent;width:100%;font-size:14px}
.search svg{color:var(--muted);flex:none}
.toggle{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:500;color:var(--text-2)}
.toggle[aria-pressed="true"]{background:var(--warn-soft);border-color:transparent;color:var(--warn-ink)}

.tablebox{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{padding:12px 16px;font-size:12px;font-weight:500;color:var(--muted);text-align:left;white-space:nowrap}
td{padding:12px 16px;border-top:1px solid var(--line);font-size:14px;white-space:nowrap}
tbody tr{transition:background .12s}
tbody tr:hover{background:var(--surface-2)}
.r{text-align:right;font-variant-numeric:tabular-nums}
.name{display:inline-flex;align-items:center;gap:10px;color:var(--text);font-weight:500}
.sub{color:var(--muted)}
.neg{color:var(--bad-ink);font-weight:600}
.pos{color:var(--good-ink);font-weight:500}
.meter{display:inline-flex;gap:3px;vertical-align:middle;margin-right:8px}
.meter i{width:6px;height:6px;border-radius:2px;background:var(--line-strong)}
.meter i.on{background:var(--brand)}
.meter.low i.on{background:var(--warn-ink)}

.j th{padding:10px 4px;text-align:center;font-size:11px;line-height:1.25}
.j th.nm,.j td.nm{text-align:left;padding-left:16px;position:sticky;left:0;background:var(--surface);z-index:1}
.j td{padding:0 4px;height:46px;text-align:center}
.j th.nx{color:var(--brand)}
.mk{display:inline-block;width:14px;height:14px;border-radius:99px;vertical-align:middle}
.mk.y{background:var(--brand)}
.mk.n{box-shadow:inset 0 0 0 2px var(--line-strong)}
.mk.f{box-shadow:inset 0 0 0 2px var(--line);opacity:.7}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;gap:6px;align-items:center}

.slist a{display:grid;grid-template-columns:minmax(150px,1.2fr) 110px 70px minmax(120px,1fr) auto;gap:8px 20px;align-items:center;padding:14px 16px;border-top:1px solid var(--line);color:var(--text);font-size:14px}
.slist a:first-child{border-top:0}
.slist a:hover{background:var(--surface-2)}
@media (max-width:640px){.slist a{grid-template-columns:1fr auto}.slist .hide-sm{display:none}}
.sh{margin:0 0 8px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.att{display:inline-flex;gap:10px;align-items:center;color:var(--text-2);font-variant-numeric:tabular-nums}
.att .bar{width:72px;margin:0}

.empty{padding:32px 16px;text-align:center;color:var(--muted);font-size:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.wrap{max-width:1240px;gap:18px}
.gtop{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center}
.gtop h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.02em}
.gtop .sp{flex:1}
.gtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.gtabs button{height:44px;padding:0 14px;border:0;background:transparent;font-size:14.5px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.gtabs button:hover{color:var(--text)}
.gtabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--brand)}
.gtabs .cnt{margin-left:6px;font-size:12.5px;opacity:.6}
.gtabs .warn-dot{display:inline-block;width:7px;height:7px;border-radius:99px;background:var(--warn-ink);margin-left:6px;vertical-align:middle}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:1000px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.tiles{grid-template-columns:1fr}}
.t{display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:16px;border:1px solid var(--line);background:var(--surface);text-align:left;color:var(--text);min-height:118px}
button.t:hover,a.t:hover{border-color:var(--line-strong)}
.t .tk{font-size:12.5px;font-weight:500;color:var(--muted);display:flex;align-items:center;gap:6px}
.t .tv{font-size:22px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.t .ts{font-size:13px;color:var(--text-2)}
.t.next{background:var(--brand);border-color:transparent;color:#fff}
.t.next .tk,.t.next .ts{color:rgba(255,255,255,.85)}
.t.next .go{margin-top:auto;align-self:flex-start;display:inline-flex;gap:6px;align-items:center;height:34px;padding:0 12px;border-radius:10px;border:0;background:#fff;color:var(--brand);font-size:13.5px;font-weight:600}
.t.warn{background:var(--warn-soft);border-color:transparent}
.t.warn .tk,.t.warn .tv,.t.warn .ts{color:var(--warn-ink)}
.stk{display:flex;margin-top:auto}.stk .av{width:26px;height:26px;font-size:10px;box-shadow:0 0 0 2px var(--warn-soft)}.stk .av+.av{margin-left:-7px}
.dist{display:flex;height:6px;border-radius:99px;overflow:hidden;gap:2px;margin-top:auto}
.spark{display:flex;align-items:flex-end;gap:3px;height:26px;margin-top:auto}
.spark i{flex:1;border-radius:2px;background:var(--brand)}
.ov3{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}

@media (max-width:640px){.ov3{grid-template-columns:1fr}}
.ov{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.ov{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:16px}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.ch h2{margin:0;font-size:15.5px;font-weight:600}
.lnk{border:0;background:transparent;color:var(--brand);font-size:13.5px;font-weight:500;padding:0;display:inline-flex;gap:5px;align-items:center}
.lnk svg{width:14px;height:14px}
.kv div{display:flex;justify-content:space-between;gap:16px;padding:10px 16px;border-top:1px solid var(--line);font-size:14px}
.kv div:first-child{border-top:0}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{font-weight:500;text-align:right}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:560px){.two{grid-template-columns:1fr}}
.prow{display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--line);font-size:14px}
.prow:first-child{border-top:0}
.prow .av{width:28px;height:28px;font-size:10.5px}
.prow .sub{font-size:12.5px}
.srow{display:flex;justify-content:space-between;gap:12px;padding:10px 16px;border-top:1px solid var(--line);font-size:14px}
.srow:first-child{border-top:0}
.srow b{font-weight:600;font-variant-numeric:tabular-nums}
.srow .sub{font-size:13px}
.snote{display:flex;gap:8px;align-items:center;padding:10px 16px;border-top:1px solid var(--line);font-size:13px;background:var(--warn-soft);color:var(--warn-ink)}
.feed{display:flex;flex-direction:column}
.composer{display:flex;flex-direction:column;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.composer textarea{width:100%;min-height:44px;resize:vertical;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font:inherit;font-size:14px;color:var(--text);transition:min-height .15s}
.composer textarea:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);min-height:80px}
.composer .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.fchips2{display:flex;gap:6px}
.fchips2 button{height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:500;color:var(--text-2)}
.fchips2 button[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:var(--surface)}
.ev{display:grid;grid-template-columns:32px 1fr;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.ev:first-child{border-top:0}
.evi{width:32px;height:32px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;background:var(--surface-2);color:var(--muted)}
.evi svg{width:15px;height:15px}
.evi.c{background:var(--brand-soft);color:var(--brand-ink)}
.evi.w{background:var(--warn-soft);color:var(--warn-ink)}
.ev .eh{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:13px}
.ev .eh b{font-weight:600;font-size:13.5px}
.ev .eh span{color:var(--muted)}
.ev .et{font-size:14px;color:var(--text-2);margin-top:3px;line-height:1.45}
.ev.comment .et{color:var(--text);background:var(--surface-2);padding:8px 12px;border-radius:4px 12px 12px 12px;margin-top:6px}
.daysep{padding:8px 16px;font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);border-top:1px solid var(--line)}
.daysep:first-child{border-top:0}
.ring{position:relative;width:32px;height:32px;flex:none;display:inline-block;vertical-align:middle}
.ring svg{transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
.subs td{white-space:normal}
</style>
</head>
<body>
<div id="app"></div>
<script>
const I = {
  clock:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',

  edit:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
  cal:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
  users:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20a6.5 6.5 0 0 0-4-6"/></svg>',
  trash:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>',
  alert:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>',

function ring(c){
  const s = 32, R = 12.5, L = 2 * Math.PI * R;
  let frac, label, color;
  if (c.left === Infinity) { frac = 1; label = '∞'; color = 'var(--brand)'; }
  else if (c.left === null) { frac = 0; label = '—'; color = 'var(--bad-ink)'; }
  else { frac = c.left / c.total; label = c.left; color = c.left <= 1 ? 'var(--warn-ink)' : 'var(--brand)'; }
  return `<span class="ring" role="img" aria-label="Осталось: ${label}"><svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}" aria-hidden="true"><circle cx="16" cy="16" r="${R}" fill="none" stroke="var(--line)" stroke-width="3.5"/><circle cx="16" cy="16" r="${R}" fill="none" stroke="${color}" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="${L * frac} ${L}"/></svg><span>${label}</span></span>`;
}

  if (a === 'menu') state.menu = !state.menu;
  if (a === 'tab') { state.tab = t.dataset.v; state.q = ''; }
  render();
});
document.addEventListener('input', e => {
  if (e.target.id !== 'q') return;
  state.q = e.target.value; const p = e.target.selectionStart; render();
  const q = document.getElementById('q'); q.focus(); q.setSelectionRange(p, p);
});
render();
</script>
</body>
