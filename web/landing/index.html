<!doctype html>
<!--
  Публичный лендинг: отдаётся на корне основного домена, независимо от SPA и API.
  Ссылки относительные — внешний nginx перенаправляет /login и /sign-up на хост CRM (app.),
  /cabinet — на хост кабинета клиента (clients.).
  Строки не из словарей i18n: у лендинга пока один язык (см. web/README.md).
-->
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="AthleticaCRM — CRM для спортивных школ и клубов" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Ctext x='16' y='22' font-family='system-ui,sans-serif' font-size='18' font-weight='700' fill='%23fff' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E"
    />
    <title>AthleticaCRM</title>
    <style>
      :root {
        --bg: #f8fafc;
        --fg: #0f172a;
        --accent: #4f46e5;
        --accent-fg: #ffffff;
        --border: #cbd5e1;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #020617;
          --fg: #f1f5f9;
          --border: #334155;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        box-sizing: border-box;
        background: var(--bg);
        color: var(--fg);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        text-align: center;
      }
      h1 {
        margin: 0 0 32px;
        font-size: clamp(2rem, 6vw, 3rem);
      }
      nav {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }
      nav a {
        padding: 12px 24px;
        border-radius: 8px;
        border: 1px solid var(--border);
        color: var(--fg);
        text-decoration: none;
        font-weight: 600;
      }
      nav a.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-fg);
      }
      .clients {
        margin: 24px 0 0;
      }
      .clients a {
        color: inherit;
        font-weight: 600;
        text-underline-offset: 3px;
      }
      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>AthleticaCRM</h1>
      <nav>
        <a href="/login">Войти</a>
        <a class="primary" href="/sign-up">Регистрация</a>
      </nav>
      <p class="clients">Вы клиент клуба? <a href="/cabinet">Войти в кабинет</a></p>
    </main>
  </body>
</html>
