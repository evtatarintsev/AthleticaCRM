ktlint = "14.2.0"
kotlin = "2.4.20"
kotlinx-coroutines = "1.11.0"
kotlinx-datetime = "0.8.0"
# 1.12.0 пока только RC — ждём стабильный релиз.
kotlinx-serialization = "1.11.0"
ktor = "3.5.2"
liquibase = "5.0.4"
logback = "1.6.3"
postgresql = "42.7.13"
r2dbc-postgresql = "1.1.2.RELEASE"
r2dbc-pool = "1.0.2.RELEASE"
testcontainers = "1.21.4"
