name: Mobile

# Мобильное приложение (`:mobile`, `:mobile:androidApp`) собирается только с `-Pathletica.mobile=true`:
# остальным job-ам и Docker-сборке Android SDK не нужен. Здесь — debug APK, тесты общих экранов
# (JVM) и ktlint модуля; Android SDK на ubuntu-latest уже установлен. iOS — отдельный job на macOS.
on:
  pull_request:
    paths:
      - "mobile/**"
      - "shared/**"
      - "gradle/**"
      - "*.gradle.kts"
      - ".github/workflows/mobile.yml"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew -Pathletica.mobile=true :mobile:check :mobile:androidApp:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: athletica-debug-apk
          path: mobile/androidApp/build/outputs/apk/debug/*.apk

  # iOS: тесты общего кода в симуляторе (Kotlin/Native) и Xcode-оболочка с тестами Keychain.
  # Подпись не нужна: симулятор подписывается ad hoc. Android SDK есть и на macOS-раннере —
  # он нужен Gradle, потому что `athletica.mobile=true` включает и Android-таргеты.
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew -Pathletica.mobile=true :mobile:iosSimulatorArm64Test

      - name: xcodebuild test
        working-directory: mobile/iosApp
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone.*\(([0-9A-F-]{36})\)' | grep -oE '[0-9A-F-]{36}')
          xcodebuild -project iosApp.xcodeproj -scheme iosApp -destination "id=$UDID" test
