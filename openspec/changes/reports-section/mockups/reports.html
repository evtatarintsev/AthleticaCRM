<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Отчёты — макет</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5fa;--surface:#fff;--line:#e9ebf2;--line-2:#f1f2f6;--text:#111113;--text-2:#3f3f46;--muted:#6b6b74;--brand:#2f55d4;--brand-ink:#2443b0;--good-bg:#dcfce7;--good:#166534;--bad-bg:#ffe4e4;--bad:#a3171b;--warn-bg:#fff1d6;--warn:#8a4b00}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--brand);text-decoration:none}a:hover{color:var(--brand-ink)}
button,select{font:inherit;color:inherit}
.app{min-height:100vh;display:flex;flex-wrap:wrap}
.side{flex:1 1 220px;padding:18px 12px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.club{display:flex;align-items:center;gap:10px;padding:10px;margin-bottom:10px;border-radius:14px;background:var(--bg)}
.club-av{width:36px;height:36px;border-radius:10px;background:var(--brand);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:800}
.nv{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;font-size:14px;font-weight:500;color:var(--text-2)}
.nv:hover{background:#eef0f6;color:var(--text)}
.nv-on,.nv-on:hover{background:var(--brand);color:#fff}
.main{flex:999 1 560px;min-width:0;padding:28px 24px 64px}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.mut{color:var(--muted)}
.sel{height:40px;padding:0 12px;border-radius:10px;border:1px solid #e3e5ee;background:#fff;font-size:14px;cursor:pointer}
.seg{display:inline-flex;padding:3px;gap:2px;background:#e8eaf2;border-radius:10px}
.sb{height:34px;padding:0 14px;border:0;border-radius:8px;background:transparent;font-size:14px;font-weight:500;color:#4b4b53;cursor:pointer;white-space:nowrap}
.sb.on{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(16,16,20,.14)}
.modebar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;padding:8px 12px;border-radius:12px;border:1px dashed #c4c7d4;font-size:13.5px;color:#4b4b53}
.h1{margin:0;font-size:32px;line-height:1.15;font-weight:800;letter-spacing:-.03em}
.gh{margin:6px 0 0;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:#4b4b53;text-transform:uppercase;letter-spacing:.06em}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.rc{display:flex;flex-direction:column;padding:18px;border-radius:18px;background:#fff;border:1px solid var(--line);box-shadow:0 1px 2px rgba(16,16,20,.04),0 8px 24px rgba(30,40,90,.05);color:var(--text);transition:transform .15s,box-shadow .15s}
.rc:hover{color:var(--text);transform:translateY(-2px);box-shadow:0 2px 4px rgba(16,16,20,.05),0 14px 32px rgba(30,40,90,.10)}
.ib{border-radius:12px;flex:none;display:inline-flex;align-items:center;justify-content:center}
.pill{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap}
.p-good{background:var(--good-bg);color:var(--good)}.p-bad{background:var(--bad-bg);color:var(--bad)}
.chip{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;min-height:28px;padding:4px 10px;border-radius:10px;font-size:13px;font-weight:600}
.c-red{background:#ffe9e9;color:var(--bad)}.c-amber{background:var(--warn-bg);color:var(--warn)}
.spark{display:flex;gap:3px;align-items:flex-end;height:48px;width:116px;flex:none}
.box{background:#fff;border:1px solid var(--line);border-radius:18px;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th{text-align:left;font-size:12.5px;font-weight:600;color:var(--muted);padding:12px 18px;border-bottom:1px solid #eceef4;white-space:nowrap}
td{padding:12px 18px;border-top:1px solid var(--line-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.r{text-align:right}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 1px 2px rgba(16,16,20,.04),0 8px 24px rgba(30,40,90,.05);min-width:0;padding:22px}
.ch{margin:0 0 16px;font-size:17px;font-weight:700}
.hero{border-radius:22px;color:#fff;padding:24px;display:flex;flex-wrap:wrap;gap:20px 32px;align-items:flex-end;justify-content:space-between}
.hero .pill{background:rgba(255,255,255,.2);color:#fff;height:28px;font-size:13.5px}
.tile{display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;background:#fff;border:1px solid var(--line)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.lr{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px 0;border-top:1px solid var(--line-2);font-size:14.5px}
.av{width:38px;height:38px;border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.age{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:700;margin-left:8px}
.a-red{background:var(--bad-bg);color:var(--bad)}.a-amber{background:var(--warn-bg);color:var(--warn)}.a-mute{background:#f1f2f7;color:#4b4b53}
.btn{height:36px;padding:0 14px;border-radius:10px;border:1px solid #e3e5ee;background:#fff;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#cfd3e0;background:#fafbfd}
.btn-p{border:0;background:var(--brand);color:#fff}.btn-p:hover{background:var(--brand-ink)}
.alert{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px 16px;border-radius:14px;background:var(--warn-bg);color:#5c3300;font-size:14px}
.how{padding:12px 14px;border-radius:12px;background:#fff;border:1px solid var(--line);font-size:13.5px;color:var(--text-2)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:40}
@media (max-width:640px){.main{padding:20px 16px 64px}.h1{font-size:26px}.hero{padding:18px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const P = {
  home: 'M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',
  calendar: 'M4 5h16v15H4zM4 10h16M8 3v4M16 3v4',
  user: 'M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0',
  inbox: 'M3 13h5l2 3h4l2-3h5M5 5h14l2 8v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-6z',
  users: 'M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM2 21a7 7 0 0 1 14 0M16 3.5a4 4 0 0 1 0 7.5M22 21a7 7 0 0 0-4.5-6.5',
  idcard: 'M3 5h18v14H3zM7 10a2 2 0 1 0 4 0 2 2 0 0 0-4 0M6 16a3 3 0 0 1 6 0M14 9h4M14 13h4',
  check: 'M4 4h16v16H4zM8 12l3 3 5-6',
  wallet: 'M3 7h15a3 3 0 0 1 3 3v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM3 7l12-4v4M16 14h2',
  chart: 'M4 20V10M10 20V4M16 20v-7M22 20H2',
  sliders: 'M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0',
  trend: 'M3 17l6-6 4 4 8-8M15 7h6v6',
  alert: 'M12 8v5M12 16.5v.5M10.3 3.9 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z',
  ticket: 'M3 8a2 2 0 0 0 0 4 2 2 0 0 1 0 4v2h18v-2a2 2 0 0 1 0-4 2 2 0 0 1 0-4V6H3zM14 6v12',
  calcheck: 'M4 5h16v15H4zM4 10h16M8 3v4M16 3v4M9 15l2 2 4-4',
  coach: 'M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM2 21a7 7 0 0 1 14 0M16 11l2 2 4-4',
  layers: 'M12 3 2 8l10 5 10-5zM2 13l10 5 10-5M2 18l10 5 10-5',
  building: 'M4 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16M16 9h3a1 1 0 0 1 1 1v11M2 21h20M8 7h4M8 11h4M8 15h4',
  receipt: 'M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2zM9 8h6M9 12h6M9 16h3',
  coins: 'M8 8a6 3 0 1 0 12 0 6 3 0 1 0-12 0M8 8v4c0 1.7 2.7 3 6 3s6-1.3 6-3V8M4 12a6 3 0 0 0 6 3M4 12v4c0 1.7 2.7 3 6 3',
  back: 'M9 14 4 9l5-5M4 9h11a5 5 0 0 1 0 10h-3',
  clock: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 7v5l3 2',
  book: 'M4 4h12a4 4 0 0 1 4 4v12H8a4 4 0 0 1-4-4zM4 16a4 4 0 0 1 4-4h12',
  percent: 'M19 5 5 19M7 9a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM17 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4z',
};
const svg = (d, s = 18, w = 2) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"></path></svg>`;
const fmt = (n) => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const rub = (n) => (n < 0 ? '−' : '') + fmt(Math.abs(n)) + ' ₽';
const C = {
  money: { main: '#2f55d4', mid: '#a8b8f0', tint: '#e9eeff', hero: '#2f55d4', heroInk: '#dfe6ff', title: 'Деньги' },
  clients: { main: '#0d9488', mid: '#8fd8cf', tint: '#ddf5f1', hero: '#0f766e', heroInk: '#d3f2ee', title: 'Клиенты' },
  team: { main: '#7c3aed', mid: '#c9b6f6', tint: '#efe8fe', hero: '#6d28d9', heroInk: '#ece4fe', title: 'Команда' },
  compare: { main: '#ea580c', mid: '#f8bb96', tint: '#ffeedf', hero: '#c2410c', heroInk: '#ffe8d6', title: 'Сравнения' },
};
const AV = [['#e9eeff', '#2443b0'], ['#ddf5f1', '#0f766e'], ['#efe8fe', '#6d28d9'], ['#ffeedf', '#c2410c'], ['#fde7f1', '#be185d'], ['#f1f2f7', '#3f3f46']];
const state = { view: 'cards', oneSport: false, finance: true, toast: '' };

const REPORTS = [
  { id: 'revenue', cat: 'money', money: true, name: 'Выручка', q: 'Сколько денег пришло от клиентов', value: '1 284 600 ₽', delta: '▲ 12,4%', good: true, icon: P.wallet, spark: [248, 262, 231, 270, 291, 296, 301, 318] },
  { id: 'pnl', cat: 'money', money: true, name: 'Доходы и расходы', q: 'Сколько осталось после всех расходов', value: '422 300 ₽', delta: '▲ 41,6%', good: true, icon: P.trend, spark: [230, 120, -80, 25, 465, 422] },
  { id: 'debts', cat: 'money', money: true, name: 'Долги клиентов', q: 'Кто должен за абонементы и занятия', value: '96 300 ₽', delta: '▼ 8,1%', good: true, icon: P.alert, spark: [112, 108, 104, 110, 101, 98, 99, 96], warn: '14 клиентов должны', warnCls: 'c-amber' },
  { id: 'sales', cat: 'clients', name: 'Продажи абонементов', q: 'Что покупают и продлевают ли', value: '174 шт.', delta: '▲ 8,1%', good: true, icon: P.ticket, spark: [36, 38, 33, 40, 41, 44, 42, 45], warn: '8 закончатся без продления', warnCls: 'c-red' },
  { id: 'attendance', cat: 'clients', name: 'Посещаемость', q: 'Ходят ли клиенты на занятия', value: '83,3%', delta: '▲ 1,2 п.п.', good: true, icon: P.calcheck, spark: [80, 81, 79, 82, 82, 83, 84, 83], warn: '17 перестали ходить', warnCls: 'c-red' },
  { id: 'groups', cat: 'clients', name: 'Группы', q: 'Какие группы растут, а какие теряют клиентов', value: 'Юниоры У12', delta: '▲ 9 клиентов', good: true, icon: P.users, spark: [372, 375, 378, 380, 383, 386, 390, 394], warn: 'Юниоры У8: −5 клиентов', warnCls: 'c-amber' },
  { id: 'coaches', cat: 'team', name: 'Тренеры и залы', q: 'Кто сколько работает, где свободное время', value: '296 ч', delta: '▲ 3,5%', good: true, icon: P.coach, spark: [268, 274, 271, 280, 276, 286, 290, 296] },
  { id: 'directions', cat: 'compare', name: 'Направления', q: 'Какое направление растёт, какое падает', value: 'Футбол', delta: '▲ 19,3%', good: true, icon: P.layers, spark: [270, 282, 290, 301, 315, 322, 350, 384], warn: 'ОФП: выручка −5,4%', warnCls: 'c-amber' },
  { id: 'branches', cat: 'compare', money: true, name: 'Филиалы', q: 'Какой филиал зарабатывает', value: '3 филиала', delta: '', good: true, icon: P.building, spark: [310, 290, 180, 240, 430, 452, 470, 498], warn: 'Юг: остаётся 6,8% выручки', warnCls: 'c-amber' },
];
const visible = () => REPORTS.filter((r) => !(state.oneSport && r.id === 'directions') && (state.finance || !r.money));

function sparkBars(vals, c, h = 48) {
  const min = Math.min(...vals), max = Math.max(...vals);
  return vals.map((v, i) => `<span style="flex:1 1 0;height:${Math.round(h * 0.2 + (v - min) / (max - min || 1) * h * 0.8)}px;border-radius:3px;background:${v < 0 ? '#f87171' : i === vals.length - 1 ? c.main : c.mid}"></span>`).join('');
}
function shell(content) {
  const nav = [['Главная', P.home], ['Расписание', P.calendar], ['Клиенты', P.user], ['Входящие', P.inbox], ['Группы', P.users], ['Сотрудники', P.idcard], ['Задачи', P.check], ['Финансы', P.wallet], ['Отчёты', P.chart], ['Настройки', P.sliders]];
  return `<div class="app"><nav class="side" aria-label="Разделы">
    <div class="club"><span class="club-av" aria-hidden="true">A</span><span><b style="display:block;font-size:14px">Athletica</b><span class="mut" style="font-size:12.5px">Филиал «Центр»</span></span></div>
    ${nav.map(([n, i]) => `<a class="nv ${n === 'Отчёты' ? 'nv-on' : ''}" href="${n === 'Отчёты' ? '#' : '#'}" data-act="${n === 'Отчёты' ? 'home' : 'toast'}" data-v="Раздел «${n}»">${svg(i)}${n}</a>`).join('')}
  </nav><main class="main"><div class="wrap">${content}</div></main></div>`;
}
function modebar() {
  const b = (act, v, on, label) => `<button class="sb ${on ? 'on' : ''}" data-act="${act}" data-v="${v}" aria-pressed="${on}">${label}</button>`;
  return `<div class="modebar"><span>Только в макете:</span><div style="display:flex;flex-wrap:wrap;gap:8px">
    <div class="seg" role="group" aria-label="Сколько направлений в клубе">${b('sport', 'many', !state.oneSport, 'Несколько направлений')}${b('sport', 'one', state.oneSport, 'Одно направление')}</div>
    <div class="seg" role="group" aria-label="Права сотрудника">${b('fin', 'yes', state.finance, 'С правом «Финансы»')}${b('fin', 'no', !state.finance, 'Без права')}</div>
  </div></div>`;
}
function filters(extra = '') {
  return `<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">
    <select class="sel" aria-label="Период"><option>Октябрь 2026 (1–27)</option><option>Сентябрь 2026</option><option>Последние 30 дней</option><option>Квартал</option><option>Свой период…</option></select>
    <select class="sel" aria-label="Филиал"><option>Филиал «Центр»</option><option>Филиал «Север»</option><option>Филиал «Юг»</option><option>Все филиалы</option></select>${extra}</div>`;
}

function homeView() {
  const seg = (v, label) => `<button class="sb ${state.view === v ? 'on' : ''}" data-act="view" data-v="${v}" aria-pressed="${state.view === v}">${label}</button>`;
  let body = '';
  if (state.view === 'cards') {
    body = ['money', 'clients', 'team', 'compare'].map((k) => {
      const cards = visible().filter((r) => r.cat === k);
      if (!cards.length) return '';
      const c = C[k];
      return `<section style="display:flex;flex-direction:column;gap:12px"><h2 class="gh"><span class="dot" style="background:${c.main}"></span>${c.title}</h2><div class="grid">${cards.map((r) => `
        <a class="rc" href="#${r.id}">
          <span style="display:flex;align-items:center;gap:12px">
            <span class="ib" style="width:44px;height:44px;background:${c.tint};color:${c.main}">${svg(r.icon, 22)}</span>
            <span style="flex:1;min-width:0"><span style="display:block;font-size:15.5px;font-weight:700">${r.name}</span><span class="mut" style="display:block;font-size:12.5px;line-height:1.35">${r.q}</span></span>
            <span aria-hidden="true" style="color:#9a9aa5;font-size:22px;line-height:1">›</span>
          </span>
          <span style="display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:16px">
            <span style="min-width:0"><span style="display:block;font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1.1">${r.value}</span>${r.delta ? `<span class="pill ${r.good ? 'p-good' : 'p-bad'}" style="margin-top:8px">${r.delta}</span>` : ''}</span>
            <span class="spark" aria-hidden="true">${sparkBars(r.spark, c)}</span>
          </span>
          ${r.warn ? `<span class="chip ${r.warnCls}" style="margin-top:14px">${svg(P.alert, 15, 2.2)}${r.warn}</span>` : ''}
        </a>`).join('')}</div></section>`;
    }).join('');
  } else {
    const g = (k) => `<tr><td colspan="4" style="padding:18px 18px 8px;border-top:0;font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:${C[k].main}">${C[k].title}</td></tr>`;
    const row = (name, now, was, d, good, id) => `<tr><td><a href="#${id}" style="color:var(--text);font-weight:500">${name}</a></td><td class="r" style="font-weight:700">${now}</td><td class="r mut">${was}</td><td class="r"><span class="pill ${good ? 'p-good' : 'p-bad'}">${d}</span></td></tr>`;
    const money = state.finance ? g('money') + row('Выручка', '1 284 600 ₽', '1 142 900 ₽', '▲ 12,4%', true, 'revenue') + row('Расходы', '862 300 ₽', '844 600 ₽', '▲ 2,1%', false, 'pnl') + row('Прибыль', '422 300 ₽', '298 300 ₽', '▲ 41,6%', true, 'pnl') + row('Средний чек', '6 003 ₽', '5 831 ₽', '▲ 2,9%', true, 'revenue') + row('Долг клиентов', '96 300 ₽', '104 800 ₽', '▼ 8,1%', true, 'debts') : '';
    body = `<div class="box"><table><thead><tr><th>Показатель</th><th class="r">Октябрь, 1–27</th><th class="r">Сентябрь, 1–27</th><th class="r">Изменение</th></tr></thead><tbody>
      ${money}${g('clients')}${row('Продано абонементов', '174', '161', '▲ 8,1%', true, 'sales')}${row('Доля продлений', '78%', '81%', '▼ 3 п.п.', false, 'sales')}${row('Активные клиенты', '352', '338', '▲ 4,1%', true, 'groups')}${row('Посещаемость', '83,3%', '82,1%', '▲ 1,2 п.п.', true, 'attendance')}${row('Перестали ходить', '17', '12', '▲ 5', false, 'attendance')}
      ${g('team')}${row('Проведено занятий', '210', '203', '▲ 3,4%', true, 'coaches')}${row('Часы тренеров', '296 ч', '286 ч', '▲ 3,5%', true, 'coaches')}${row('Отменено занятий', '10', '7', '▲ 3', false, 'coaches')}
    </tbody></table></div><div style="display:flex;justify-content:flex-end"><button class="sel" data-act="toast" data-v="Выгрузка таблицы в Excel" style="font-weight:600">Выгрузить в Excel</button></div>`;
  }
  const note = [];
  if (state.oneSport) note.push('В клубе один вид спорта, поэтому отчёта «Направления» нет. Что растёт, а что проседает, видно в отчёте «Группы».');
  if (!state.finance) note.push('У сотрудника нет права просмотра финансов: денежных отчётов (выручка, доходы и расходы, долги, филиалы) он не видит.');
  return shell(`${modebar()}

function render() {
  const id = location.hash.slice(1);
  const r = visible().find((x) => x.id === id);
  document.getElementById('app').innerHTML = (r ? reportView(r, CFG[r.id]()) : homeView()) + (state.toast ? `<div class="toast" role="status">${state.toast}</div>` : '');
}
let toastTimer;
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const a = t.dataset.act, v = t.dataset.v;
  if (a === 'home') { e.preventDefault(); location.hash = ''; return; }
  if (a === 'toast') { e.preventDefault(); state.toast = v + ' — в макете не открывается'; clearTimeout(toastTimer); toastTimer = setTimeout(() => { state.toast = ''; render(); }, 2200); }
  if (a === 'view') state.view = v;
  if (a === 'sport') state.oneSport = v === 'one';
  if (a === 'fin') state.finance = v === 'yes';
  render();
});
window.addEventListener('hashchange', () => { window.scrollTo(0, 0); render(); });
