# Статика нового веб-фронтенда. Внешний nginx проксирует сюда /web/ без изменения пути.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;

    # Ассеты Vite содержат хэш в имени — кэшируем навсегда
    location /web/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Любой другой путь под /web/ — маршрут SPA; index.html не кэшируется
    location /web/ {
        add_header Cache-Control "no-cache";
        try_files $uri /web/index.html;
    }

    location = /web {
        return 301 /web/;
    }
}
