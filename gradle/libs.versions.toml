koog-deepseek = "1.3.0-beta"
# Мобильное приложение (`:mobile`, только при `-Pathletica.mobile=true`).
agp = "9.5.3"
compose-multiplatform = "1.12.2"
compose-material3 = "1.9.0"
androidx-navigation = "2.10.0"
